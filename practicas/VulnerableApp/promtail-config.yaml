server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml 

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: vulnerableapp_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: vulnerableapp
          app: VulnerableApp 
          __path__: /var/log/VulnerableApp/*.txt 
          
    pipeline_stages:
      - regex:
          
          expression: '.*(?P<keyword>Auth\.Login|Auth\.Dashboard|Search\.Index).*'
      - template:
          source: category
          
          template: '{{ if eq .keyword "Auth.Login" }}Security{{ else if eq .keyword "Auth.Dashboard" }}Security{{ else if eq .keyword "Search.Index" }}Audit{{ else }}General{{ end }}'
      - labels:
          category: 